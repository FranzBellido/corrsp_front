services:

  # ==========================================
  # Frontend - Nuxt / Nitro (producción)
  #
  # Portainer / Docker Stack: no usa .env en disco; defina las variables
  # en "Environment variables" del stack (mismos nombres que .env.example).
  # Con ssr: false las NUXT_PUBLIC_* deben estar en el BUILD (build.args).
  # Tras cambiar URLs: rebuild de la imagen.
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_KEYCLOAK_URL: ${NUXT_PUBLIC_KEYCLOAK_URL}
        NUXT_PUBLIC_KEYCLOAK_REALM: ${NUXT_PUBLIC_KEYCLOAK_REALM}
        NUXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NUXT_PUBLIC_KEYCLOAK_CLIENT_ID}
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
        NUXT_PUBLIC_API_PUBLIC_URL: ${NUXT_PUBLIC_API_PUBLIC_URL}
        NUXT_PUBLIC_ONLY_OFFICE_TOKEN: ${NUXT_PUBLIC_ONLY_OFFICE_TOKEN}
        NUXT_PUBLIC_ONLY_OFFICE_SERVER: ${NUXT_PUBLIC_ONLY_OFFICE_SERVER}
    image: afcoop-frontend:${IMAGE_TAG:-latest}
    container_name: afcoop-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      NUXT_PUBLIC_KEYCLOAK_URL: ${NUXT_PUBLIC_KEYCLOAK_URL}
      NUXT_PUBLIC_KEYCLOAK_REALM: ${NUXT_PUBLIC_KEYCLOAK_REALM}
      NUXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NUXT_PUBLIC_KEYCLOAK_CLIENT_ID}
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
      NUXT_PUBLIC_API_PUBLIC_URL: ${NUXT_PUBLIC_API_PUBLIC_URL}
      NUXT_PUBLIC_ONLY_OFFICE_TOKEN: ${NUXT_PUBLIC_ONLY_OFFICE_TOKEN}
      NUXT_PUBLIC_ONLY_OFFICE_SERVER: ${NUXT_PUBLIC_ONLY_OFFICE_SERVER}
